name: multimodal-rag

x-backend-env: &backend-env
  RAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  RAG_REDIS_URL: redis://redis:6379/0
  RAG_QDRANT_URL: http://qdrant:6333
  RAG_CLAMAV_HOST: clamav
  RAG_FILES_DIR: /data/files
  RAG_PHOENIX_ENDPOINT: http://phoenix:6006/v1/traces

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

  clamav:
    image: clamav/clamav:1.5.4-debian
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxFileSize: 110M
      CLAMD_CONF_MaxScanSize: 400M
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  phoenix:
    image: arizephoenix/phoenix:version-20.19.0-nonroot
    restart: unless-stopped
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PHOENIX_SQL_DATABASE_SCHEMA: phoenix
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:6006:6006"  # Phoenix UI has no login; keep it on localhost (Caddy auth in Plan 8)

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      phoenix:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker", "-Q", "ingestion,evaluation", "--concurrency=2", "--loglevel=INFO"]
    env_file: .env
    environment: *backend-env
    volumes:
      - files:/data/files
    depends_on:
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  clamav-db:
  files:
