name: multimodal-rag

x-backend-env: &backend-env
  RAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  RAG_REDIS_URL: redis://redis:6379/0
  RAG_QDRANT_URL: http://qdrant:6333
  RAG_CLAMAV_HOST: clamav
  RAG_FILES_DIR: /data/files
  RAG_PHOENIX_ENDPOINT: http://phoenix:6006/v1/traces

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
      PHOENIX_DB_PASSWORD: ${PHOENIX_DB_PASSWORD:?set PHOENIX_DB_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:1.5.4-debian
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxFileSize: 110M
      CLAMD_CONF_MaxScanSize: 400M
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  phoenix:
    image: arizephoenix/phoenix:version-20.19.0-nonroot
    restart: unless-stopped
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:${PHOENIX_DB_PASSWORD}@postgres:5432/phoenix
      PHOENIX_HOST_ROOT_PATH: /phoenix
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ${RAG_SERVICE_ENV_FILE:-.env}
    environment: *backend-env
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker", "-Q", "ingestion", "--concurrency=2", "--max-tasks-per-child=20", "--loglevel=INFO"]
    mem_limit: 6g
    env_file: ${RAG_SERVICE_ENV_FILE:-.env}
    environment: *backend-env
    volumes:
      - files:/data/files
    depends_on:
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy

  worker-eval:  # eval runs get their own worker so they never starve ingestion
    build:
      context: ../backend
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker", "-Q", "evaluation", "--concurrency=1", "--max-tasks-per-child=20", "--loglevel=INFO"]
    mem_limit: 3g
    env_file: ${RAG_SERVICE_ENV_FILE:-.env}
    environment: *backend-env
    volumes:
      - files:/data/files
    depends_on:
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Knowledge Assistant}
        NEXT_PUBLIC_PHOENIX_URL: /phoenix
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      RAG_DOMAIN: ${RAG_DOMAIN:-localhost}
      PHOENIX_BASIC_AUTH_USER: ${PHOENIX_BASIC_AUTH_USER:?set PHOENIX_BASIC_AUTH_USER in deploy/.env}
      PHOENIX_BASIC_AUTH_HASH: ${PHOENIX_BASIC_AUTH_HASH:?set PHOENIX_BASIC_AUTH_HASH in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  clamav-db:
  files:
  caddy-data:
  caddy-config:
