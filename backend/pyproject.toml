[project]
name = "multimodal-rag-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arize-phoenix-otel>=0.17.2",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "docling>=2.133.0",
    "fastapi>=0.142.2",
    "langchain-community==0.4.1",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "openinference-instrumentation-langchain>=0.1.78",
    "opentelemetry-api>=1.40",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client[fastembed]>=1.19.1",
    "ragas==0.4.3",
    "sqlalchemy[asyncio]>=2.1.3",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv]
package = false
override-dependencies = ["jiter>=0.17.0", "openai>=3.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: needs Docling ML models (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
